# project2-distributed-data/docker-compose.yml

services:

  # ── 4 MinIO storage nodes ──────────────────────────────────────────
  # They form a distributed cluster using erasure coding.
  # The {1...4} syntax tells MinIO to find its peers automatically.

  minio1:
    image: minio/minio:latest
    hostname: minio1
    command: server http://minio{1...4}/data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio1_data:/data
    networks:
      - minio_net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio2:
    image: minio/minio:latest
    hostname: minio2
    command: server http://minio{1...4}/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio2_data:/data
    networks:
      - minio_net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio3:
    image: minio/minio:latest
    hostname: minio3
    command: server http://minio{1...4}/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio3_data:/data
    networks:
      - minio_net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio4:
    image: minio/minio:latest
    hostname: minio4
    command: server http://minio{1...4}/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio4_data:/data
    networks:
      - minio_net
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── nginx load balancer ────────────────────────────────────────────
  # Your microservices talk to THIS, not to any individual minio node.
  # This is the HA layer: if one minio node dies, nginx routes around it.

  nginx:
    image: nginx:alpine
    ports:
      - "9000:9000"   # MinIO S3 API  → accessible at localhost:9000
      - "9001:9001"   # MinIO Console → accessible at localhost:9001
    volumes:
      - ./storage/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - minio_net
    depends_on:
      minio1:
        condition: service_healthy
      minio2:
        condition: service_healthy
      minio3:
        condition: service_healthy
      minio4:
        condition: service_healthy
    restart: always

  # ── uploader microservice ──────────────────────────────────────────
  uploader:
    build: ./uploader
    ports:
      - "5001:5001"
    environment:
      MINIO_ENDPOINT: nginx:9000        # talks to nginx, not a single node
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    networks:
      - minio_net
    depends_on:
      - nginx
    restart: always

  # ── reader microservice ────────────────────────────────────────────
  reader:
    build: ./reader
    ports:
      - "5002:5002"
    environment:
      MINIO_ENDPOINT: nginx:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    networks:
      - minio_net
    depends_on:
      - nginx
    restart: always

# ── Prometheus (collects metrics from MinIO) ───────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - minio_net
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # ── Grafana (visualizes the metrics) ──────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - grafana_data:/var/lib/grafana
    networks:
      - minio_net
    depends_on:
      - prometheus
    restart: always

# ── named volumes (persistent storage for each node) ──────────────────
volumes:
  minio1_data:
  minio2_data:
  minio3_data:
  minio4_data:
  grafana_data:

# ── internal network (all containers talk to each other here) ─────────
networks:
  minio_net:
    driver: bridge